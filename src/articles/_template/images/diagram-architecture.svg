      <text x="12" y="24" font-family="'Cinzel', serif" font-size="13" fill="#b98fd8">Engagement Scoring</text>
      <text x="12" y="42" font-family="'EB Garamond', serif" font-size="13" fill="#cdc3b6">Loyalists, Window Shoppers, Dormant</text>
    </g>
    <g transform="translate(16, 180)">
      <rect width="288" height="54" rx="4" fill="#201835" stroke="rgba(185,143,216,0.3)" />
      <text x="12" y="24" font-family="'Cinzel', serif" font-size="13" fill="#b98fd8">Send Time Optimization (STO)</text>
      <text x="12" y="42" font-family="'EB Garamond', serif" font-size="13" fill="#cdc3b6">Per-subscriber 168-hour probability matrix</text>
    </g>
    <g transform="translate(16, 250)">
      <rect width="288" height="54" rx="4" fill="#201835" stroke="rgba(185,143,216,0.3)" />
      <text x="12" y="24" font-family="'Cinzel', serif" font-size="13" fill="#b98fd8">Engagement Frequency</text>
      <text x="12" y="42" font-family="'EB Garamond', serif" font-size="13" fill="#cdc3b6">Fatigue warning &amp; Saturated limits</text>
    </g>
  </g>

  <!-- Connectors 2 -> 3 -->
  <path d="M 760 330 L 820 330" stroke="#d8b56b" stroke-width="1.8" stroke-dasharray="4,4" fill="none" />
  <polygon points="820,326 828,330 820,334" fill="#d8b56b" />

  <!-- Column 3: ACTIVATION -->
  <g transform="translate(820, 130)">
    <rect width="320" height="400" rx="6" fill="#151121" stroke="rgba(216,181,107,0.2)" filter="url(#boxGlow)" />
    <rect width="320" height="42" rx="6" fill="rgba(169,224,154,0.12)" />
    <text x="16" y="27" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#a9e09a" letter-spacing="1.5">03 · SACRED DISPATCH</text>
    <text x="16" y="80" font-family="'Cinzel', serif" font-size="16" font-weight="600" fill="#ece6dd">Journey Orchestration</text>

    <g transform="translate(16, 110)">
