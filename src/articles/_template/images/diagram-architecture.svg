<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <radialGradient id="diagBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1e1333" />
      <stop offset="60%" stop-color="#110d1c" />
      <stop offset="100%" stop-color="#08060e" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(216,181,107,0.1)" />
      <stop offset="50%" stop-color="rgba(216,181,107,0.5)" />
      <stop offset="100%" stop-color="rgba(216,181,107,0.1)" />
    </linearGradient>
    <filter id="boxGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="rgba(124,77,196,0.25)" />
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#diagBg)" rx="8" />
  <rect width="1198" height="598" x="1" y="1" fill="none" stroke="rgba(216,181,107,0.18)" stroke-width="1" rx="8" />

  <!-- Title bar -->
  <text x="600" y="55" font-family="'Cinzel', serif" font-size="20" font-weight="600" fill="#f3ecdf" letter-spacing="2" text-anchor="middle">THE EINSTEIN AI INFERENCE PIPELINE</text>
  <text x="600" y="80" font-family="'EB Garamond', serif" font-size="14" fill="#8f857a" text-anchor="middle">From Raw Behavioral History to Deterministic Journey Decision Splits</text>
  <line x1="200" y1="95" x2="1000" y2="95" stroke="url(#goldBorder)" stroke-width="1" />

  <!-- Column 1: DATA INGESTION -->
  <g transform="translate(60, 130)">
    <rect width="320" height="400" rx="6" fill="#151121" stroke="rgba(216,181,107,0.2)" filter="url(#boxGlow)" />
    <rect width="320" height="42" rx="6" fill="rgba(185,143,216,0.12)" />
    <text x="16" y="27" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#b98fd8" letter-spacing="1.5">01 · DATA INGESTION</text>
    <text x="16" y="80" font-family="'Cinzel', serif" font-size="16" font-weight="600" fill="#ece6dd">Behavioral Scrolls</text>
    
    <g transform="translate(16, 110)">
      <rect width="288" height="54" rx="4" fill="#1b162b" stroke="rgba(216,181,107,0.14)" />
      <text x="12" y="24" font-family="'Cinzel', serif" font-size="13" fill="#e8cf95">90-Day Engagement History</text>
      <text x="12" y="42" font-family="'EB Garamond', serif" font-size="13" fill="#8f857a">Opens, clicks, bounces, unsubscribes</text>
    </g>
    <g transform="translate(16, 180)">
      <rect width="288" height="54" rx="4" fill="#1b162b" stroke="rgba(216,181,107,0.14)" />
      <text x="12" y="24" font-family="'Cinzel', serif" font-size="13" fill="#e8cf95">Channel Signal Collector</text>
      <text x="12" y="42" font-family="'EB Garamond', serif" font-size="13" fill="#8f857a">Web conversions &amp; MobilePush events</text>
    </g>
    <g transform="translate(16, 250)">
      <rect width="288" height="54" rx="4" fill="#1b162b" stroke="rgba(216,181,107,0.14)" />
      <text x="12" y="24" font-family="'Cinzel', serif" font-size="13" fill="#e8cf95">Threshold Gate</text>
      <text x="12" y="42" font-family="'EB Garamond', serif" font-size="13" fill="#8f857a">Minimum 50,000 interactions required</text>
    </g>
  </g>

  <!-- Connectors 1 -> 2 -->
  <path d="M 380 330 L 440 330" stroke="#d8b56b" stroke-width="1.8" stroke-dasharray="4,4" fill="none" />
  <polygon points="440,326 448,330 440,334" fill="#d8b56b" />

  <!-- Column 2: MACHINE LEARNING CORE -->
  <g transform="translate(440, 130)">
    <rect width="320" height="400" rx="6" fill="#171226" stroke="rgba(216,181,107,0.3)" filter="url(#boxGlow)" />
    <rect width="320" height="42" rx="6" fill="rgba(216,181,107,0.15)" />
    <text x="16" y="27" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#e8cf95" letter-spacing="1.5">02 · PREDICTIVE CORE</text>
    <text x="16" y="80" font-family="'Cinzel', serif" font-size="16" font-weight="600" fill="#f3ecdf">Einstein Alchemy Engine</text>

    <g transform="translate(16, 110)">
