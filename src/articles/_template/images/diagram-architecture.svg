      <text x="12" y="24" font-family="'Cinzel', serif" font-size="13" fill="#e8cf95">Einstein Split Activity</text>
      <text x="12" y="42" font-family="'EB Garamond', serif" font-size="13" fill="#8f857a">Route personas along tailored paths</text>
    </g>
    <g transform="translate(16, 180)">
      <rect width="288" height="54" rx="4" fill="#1b162b" stroke="rgba(216,181,107,0.14)" />
      <text x="12" y="24" font-family="'Cinzel', serif" font-size="13" fill="#e8cf95">Einstein STO Journey Node</text>
      <text x="12" y="42" font-family="'EB Garamond', serif" font-size="13" fill="#8f857a">Holds subscriber until ideal send hour</text>
    </g>
    <g transform="translate(16, 250)">
      <rect width="288" height="54" rx="4" fill="#1b162b" stroke="rgba(216,181,107,0.14)" />
      <text x="12" y="24" font-family="'Cinzel', serif" font-size="13" fill="#e8cf95">Data Extension Extraction</text>
      <text x="12" y="42" font-family="'EB Garamond', serif" font-size="13" fill="#8f857a">Queried via Automation Studio SQL</text>
    </g>
  </g>
</svg>
