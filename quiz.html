<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coven of Technology — Trial of Apex Triggers</title>

<!-- Google Fonts prefetch (matches original) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

<!-- Fonts, base reset & keyframes -->
<link rel="stylesheet" href="styles.css">

<!-- Design Component runtime (framework - do not edit) -->
<script src="assets/support.js"></script>
<!-- Site content data (edit copy/labels/data here) -->
<script src="content.js"></script>
<!-- Application logic (state, navigation, quiz, render) -->
<script src="app.js"></script>
</head>
<body>
<x-dc>

<div style="min-height:100vh;background:#08060e;font-family:'EB Garamond',serif">

<!-- ═══════════════════════════════════════════════════════════════
  QUIZ  —  questions live in the `questions` array in the logic class
════════════════════════════════════════════════════════════════ -->
<sc-if value="{{ isQuiz }}" hint-placeholder-val="{{ true }}">
<div style="position:relative;overflow:hidden;background:radial-gradient(1100px 680px at 50% -12%,rgba(124,77,196,.42),transparent 58%),radial-gradient(720px 520px at 16% 4%,rgba(86,58,150,.32),transparent 60%),radial-gradient(640px 460px at 86% 12%,rgba(170,128,224,.24),transparent 62%),#08060e;min-height:760px">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:18px 48px;border-bottom:1px solid rgba(216,181,107,.12)">
    <div style="display:flex;align-items:center;gap:13px">
      <div style="width:36px;height:36px;border-radius:50%;border:1px solid #d8b56b;display:flex;align-items:center;justify-content:center;color:#d8b56b;font-size:16px;background:#0b0a0e">✶</div>
      <div style="font-family:Cinzel,serif;font-size:14px;font-weight:600;letter-spacing:1.5px;color:#ece6dd">TRIAL OF APEX TRIGGERS</div>
    </div>
    <div style="display:flex;align-items:center;gap:18px">
      <div style="font-family:'EB Garamond',serif;font-size:14px;color:#e8cf95;display:flex;align-items:center;gap:7px"><span style="font-size:16px">🔥</span> {{ streak }} streak</div>
      <div onclick="{{ toArticle }}" style="font-family:'EB Garamond',serif;font-size:13px;color:#8f857a;border:1px solid rgba(216,181,107,.2);padding:6px 14px;border-radius:20px;cursor:pointer">✕ Abandon</div>
    </div>
  </header>
  <div style="padding:30px 48px 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-family:'EB Garamond',serif;font-size:14px;color:#9b9189;letter-spacing:1px">{{ questionNum }}</span>
      <span style="font-family:'EB Garamond',serif;font-size:14px;color:#e8cf95">✦ 120 Aether at stake</span>
    </div>
    <div style="display:flex;gap:8px">
      <sc-for list="{{ segments }}" as="seg" hint-placeholder-count="3"><div style="{{ seg.style }}"></div></sc-for>
    </div>
  </div>
  <div style="padding:46px 48px 24px;text-align:center">
    <div style="font-size:26px;color:#b98fd8;margin-bottom:18px">✷</div>
    <h2 style="font-family:Cinzel,serif;font-weight:600;font-size:32px;line-height:1.3;color:#f3ecdf;margin:0 auto 8px;max-width:760px">{{ questionText }}</h2>
    <p style="font-family:'EB Garamond',serif;font-size:16px;color:#8f857a;margin:0">{{ questionSub }}</p>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 48px 24px;max-width:900px;margin:0 auto">
    <sc-for list="{{ options }}" as="opt" hint-placeholder-count="4">
      <div onclick="{{ opt.onClick }}" style="{{ opt.style }}">
        <span style="{{ opt.letterStyle }}">{{ opt.letter }}</span>
        <span style="{{ opt.textStyle }}">{{ opt.text }}</span>
        <span style="margin-left:auto;font-size:18px;{{ opt.markColor }}">{{ opt.mark }}</span>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{ answered }}" hint-placeholder-val="{{ false }}">
    <div style="max-width:900px;margin:0 auto 8px;padding:0 48px">
      <div style="{{ feedbackStyle }}">
        <div style="font-family:Cinzel,serif;font-size:15px;margin-bottom:6px;{{ feedbackTitleColor }}">{{ feedbackTitle }}</div>
        <div style="font-family:'EB Garamond',serif;font-size:15px;line-height:1.55;color:#cdc3b6">{{ feedbackText }}</div>
      </div>
    </div>
  </sc-if>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 48px;border-top:1px solid rgba(216,181,107,.12);margin-top:14px">
    <span style="font-family:'EB Garamond',serif;font-size:14px;color:#8f857a">Pass the trial to claim your Aether and rank up.</span>
    <div onclick="{{ onPrimary }}" style="{{ primaryStyle }}">{{ primaryLabel }}</div>
  </div>
</div>
</sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script="">
// The runtime evaluates this block with DCLogic, StreamableLogic and React
// injected as locals. app.js exposes the component class through a factory
// that receives them; we build the class and expose it as Component so the
// runtime can pick it up.
const Component = window.CovenComponentFactory(DCLogic, StreamableLogic, React);
</script>
</body>
</html>
