  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r:#ece6dd;margin:38px 0 16px\">One trigger per object<\u002Fh2>\n    <p style=\"font-family:'EB Garamond',serif;font-size:19px;line-height:1.75;color:#cdc3b6;margin:0 0 24px\">The first law of the craft: bind one trigger to each object and let a handler class carry the logic. Scatter your spells across many triggers and you forfeit all control over the order in which they wake.<\u002Fp>\n    <div style=\"border-left:2px solid #d8b56b;padding:6px 0 6px 24px;margin:32px 0;background:linear-gradient(90deg,rgba(216,181,107,.06),transparent)\">\n      <p style=\"font-family:'EB Garamond',serif;font-style:italic;font-size:21px;line-height:1.5;color:#e8cf95;margin:0\">\"A trigger should decide nothing and delegate everything. It is the doorway, not the room.\"<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#100d15;border:1px solid rgba(216,181,107,.16);border-radius:6px;padding:22px 24px;margin:28px 0;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.7;color:#cbbfae\">\n      <div style=\"color:#b98fd8;margin-bottom:6px\">// the incantation<\u002Fdiv>\n      <div><span style=\"color:#e8cf95\">trigger<\u002Fspan> AccountTrigger <span style=\"color:#e8cf95\">on<\u002Fspan> Account (before insert) {<\u002Fdiv>\n      <div style=\"padding-left:20px\">AccountHandler.conjure(Trigger.new);<\u002Fdiv>\n      <div>}<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-family:'EB Garamond',serif;font-size:19px;line-height:1.75;color:#cdc3b6;margin:0 0 12px\">Master this rite and the next scrolls — bulkification, recursion wards, and the trigger framework — will open to you.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"margin:0 auto 48px;max-width:820px;border:1px solid rgba(216,181,107,.18);border-radius:8px;padding:36px;text-align:center;background:radial-gradient(500px 200px at 50% 0%,rgba(139,92,196,.18),transparent 65%),#100d16;position:relative;z-index:1\">\n    <h3 style=\"font-family:Cinzel,serif;font-weight:600;font-size:26px;color:#f3ecdf;margin:0 0 8px\"> 14px;font-weight:600;letter-spacing:2px;color:#ece6dd\">{{ brand.name }}<\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"display:flex;gap:16px;font-family:'EB Garamond',serif;font-size:13px;color:#c5b9a8;white-space:nowrap\">\n      <span onclick=\"{{ toLibrary }}\" style=\"cursor:pointer\">Spell Book<\u002Fspan>\n      <span onclick=\"{{ toMemes }}\" style=\"cursor:pointer\">Grimoire of Memes<\u002Fspan>\n      <sc-if value=\"{{ loggedIn }}\" hint-placeholder-val=\"{{ false }}\"><span onclick=\"{{ toProfile }}\" style=\"cursor:pointer\">About Me<\u002Fspan><\u002Fsc-if>\n      <span onclick=\"{{ toTerms }}\" style=\"color:#e8cf95;cursor:pointer\">Mystic Terms &amp; Privacy<\u002Fspan>\n    <\u002Fnav>\n    <div onclick=\"{{ toSignup }}\" style=\"padding:10px 18px;border-radius:3px;background:linear-gradient(180deg,#e3c47e,#c49a4e);color:#221809;font-family:Cinzel,serif;font-weight:600;font-size:11px;letter-spacing:1.5px;cursor:pointer\">ENTER THE COVEN<\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"max-width:820px;margin:0 auto;padding:64px 48px 18px;position:relative;z-index:1;text-align:center\">\n    <div style=\"font-family:'EB Garamond',serif;letter-spacing:4px;text-transform:uppercase;font-size:12px;color:#b98fd8;margin-bottom:14px\">☽ The Coven's Accord<\u002Fdiv>\n    <h1 style=\"font-family:Cinzel,serif;font-weight:700;font-size:46px;color:#f3ecdf;margin:0 0 16px;text-shadow:0 0 40px rgba(139,92,196,.28)\">Mystic Terms &amp; Privacy<\u002Fh1>\n    <p style=\"font-family:'EB Garamond',serif;font-size:19px;line-height:1.6;color:#b3a99d;max-width:580px;margin:0 auto 14px\">The pact between you and the coven — what we ask of you, what we gather, and how we guard it.<\u002Fp>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;color:#8f857a\">LAST INSCRIBED · {{ brand.termsDate }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TERMS BODY — edit section copy directly here -->\n  <div style=\"max-width:820px;margin:0 auto;padding:30px 48px 56px;position:relative;z-index:1\">\n    <div style=\"border:1px solid rgba(216,181,107,.18);border-radius:8px;padding:24px 28px;margin-bottom:40px;background:radial-gradient(500px 200px at 20% 0%,rgba(139,92,196,.14),transparent 65%),#100d16\">\n      <p style=\"font-family:'EB Garamond',serif;font-size:17px;line-height:1.7;color:#cdc3b6;margin:0\">Welcome, seeker. By entering the Coven of Technology you accept the terms below and entrust us with the care of your data. We keep this plain and honest — no cursed fine print.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:36px\">\n      <h2 style=\"font-family:Cinzel,serif;font-weight:600;font-size:24px;color:#ece6dd;margin:0 0 12px;display:flex;align-items:center;gap:12px\"><span style=\"color:#d8b56b\">✦<\u002Fspan> The Pact — using the coven<\u002Fh2>\n      <p style=\"font-family:'EB Garamond',serif;font-size:17px;line-height:1.7;color:#b3a99d;margin:0\">The Coven of Technology is a place of learning. You may read the scrolls, attempt the trials, and earn your rank for your own growth and craft. The scrolls, trials, and teachings remain the intellectual property of the coven and its authors — you're welcome to learn from them, but not to resell or redistribute them without written consent. Use the coven kindly: no harassment of fellow members, no abuse of the platform, no dark magic.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:36px\">\n      <h2 style=\"font-family:Cinzel,serif;font-weight:600;font-size:24px;color:#ece6dd;margin:0 0 12px;display:flex;align-items:center;gap:12px\"><span style=\"color:#d8b56b\">⟡<\u002Fspan> What we gather<\u002Fh2>\n      <p style=\"font-family:'EB Garamond',serif;font-size:17px;line-height:1.7;color:#b3a99d;margin:0\">To welcome you into the circle we collect what you give us — your coven name and email when you register. As you study, we record your learning progress: scrolls read, trial scores, Aether earned, and your rank. We also note basic technical details such as browser and device type, and anonymized usage patterns that help us improve the craft.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:36px\">\n      <h2 style=\"font-family:Cinzel,serif;font-weight:600;font-size:24px;color:#ece6dd;margin:0 0 12px;display:flex;align-items:center;gap:12px\"><span style=\"color:#d8b56b\">✷<\u002Fspan> How the Aether flows<\u002Fh2>\n      <p style=\"font-family:'EB Garamond',serif;font-size:17px;line-height:1.7;color:#b3a99d;margin:0\">We use your data to track your progress, power the ranks and the coven leaderboard, recommend the next scroll, and keep your account secure. We may send you the occasional missive about new scrolls or coven happenings — you can silence these at any time. We never sell your personal data to anyone, in this realm or another.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:36px\">\n      <h2 style=\"font-family:Cinzel,serif;font-weight:600;font-size:24px;color:#ece6dd;margin:0 0 12px;display:flex;align-items:center;gap:12px\"><span style=\"color:#d8b56b\">☽<\u002Fspan> Cookies &amp; scrying<\u002Fh2>\n      <p style=\"font-family:'EB Garamond',serif;font-size:17px;line-height:1.7;color:#b3a99d;margin:0\">We use essential cookies to keep you signed in and remember your progress, plus optional analytics cookies that show us how the coven is used. You may clear or decline the optional ones at any time through your browser without losing your place.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:36px\">\n      <h2 style=\"font-family:Cinzel,serif;font-weight:600;font-size:24px;color:#ece6dd;margin:0 0 12px;display:flex;align-items:center;gap:12px\"><span style=\"color:#d8b56b\">✶<\u002Fspan> Third-party spirits<\u002Fh2>\n      <p style=\"font-family:'EB Garamond',serif;font-size:17px;line-height:1.7;color:#b3a99d;margin:0\">A few trusted familiars help us run the coven — hosting, analytics, and email providers who process data on our behalf under their own safeguards. We share only what they need to serve you, and never more.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:36px\">\n      <h2 style=\"font-family:Cinzel,serif;font-weight:600;font-size:24px;color:#ece6dd;margin:0 0 12px;display:flex;align-items:center;gap:12px\"><span style=\"color:#d8b56b\">⚖<\u002Fspan> Your rights as a member<\u002Fh2>\n      <p style=\"font-family:'EB Garamond',serif;font-size:17px;line-height:1.7;color:#b3a99d;margin:0\">The coven serves you, not the other way around. You may request access to your data, correct it, export it, or ask us to erase it entirely. You can withdraw consent or unsubscribe whenever you wish. Send a raven (or an email) and we'll honor your request promptly.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:40px\">\n      <h2 style=\"font-family:Cinzel,serif;font-weight:600;font-size:24px;color:#ece6dd;margin:0 0 12px;display:flex;align-items:center;gap:12px\"><span style=\"color:#d8b56b\">⚿<\u002Fspan> Guarding &amp; keeping<\u002Fh2>\n      <p style=\"font-family:'EB Garamond',serif;font-size:17px;line-height:1.7;color:#b3a99d;margin:0\">We keep your data only while your account lives, and protect it with reasonable wards and safeguards. No spell is perfectly unbreakable, but we treat your trust as sacred and act quickly should anything go amiss.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(216,181,107,.14);padding-top:30px;text-align:center\">\n      <div style=\"font-size:22px;color:#d8b56b;margin-bottom:12px\">✉<\u002Fdiv>\n      <h3 style=\"font-family:Cinzel,serif;font-weight:600;font-size:22px;color:#f3ecdf;margin:0 0 10px\">Summon the coven<\u002Fh3>\n      <p style=\"font-family:'EB Garamond',serif;font-size:17px;line-height:1.7;color:#b3a99d;margin:0 auto;max-width:480px\">Questions about these terms or your data? Reach the coven at <span style=\"color:#e8cf95\">{{ brand.contact }}<\u002Fspan> and we'll answer.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- F t.screen === 'result',\n      isLeaderboard: st.screen === 'leaderboard',\n      isSignup:      st.screen === 'signup',\n      isProfile:     st.screen === 'profile',\n      isTerms:       st.screen === 'terms',\n      isMemes:       st.screen === 'memes',\n      loggedIn:      st.loggedIn,\n\n      // Navigation\n      toLanding:     function() { this.go('landing'); }.bind(this),\n      toLibrary:     function() { this.go('library'); }.bind(this),\n      toArticle:     function() { this.go('article'); }.bind(this),\n      toLeaderboard: function() { this.go('leaderboard'); }.bind(this),\n      toSignup:      function() { this.go('signup'); }.bind(this),\n      toProfile:     function() { this.openProfile(); }.bind(this),\n      toTerms:       function() { this.go('terms'); }.bind(this),\n      toMemes:       function() { this.go('memes'); }.bind(this),\n      login:         function() { this.login(); }.bind(this),\n      startTrial:    function() { this.startTrial(); }.bind(this),\n\n      // Content (dotted paths used in template)\n      brand:               C.brand,\n      hero:                C.hero,\n      heroStats:           C.stats,\n      ranks,\n      featuredScrolls,\n      activeScrolls,\n      lockedScrolls,\n      pod1, pod2, pod3,\n      leaderboardRows,\n      featuredMeme:        C.featuredMeme,\n      memes,\n\n      // Profile\n      profileInitial:      P.initial,\n      profileName:         P.name,\n      profileRankBadge:    '✦ ' + P.rankLabel,\n      profilePath:         P.path,\n      profileAether:       '✦ ' + P.aether,\n      profileAetherNext:   P.aetherNextLabel,\n      navRankLabel:        P.rankLabel + ' · ✦ ' + P.aether,\n      navAetherBarStyle,\n      aetherBarStyle,\n      profileStats,\n      recentActivity,\n      profileRanks,\n      profileRankTrailStyle,\n      continueScrolls,\n\n      // Quiz\n      streak:              3,\n      questionNum:         'QUESTION ' + (st.qIndex + 1) + ' OF ' + total,\n      questionText:
