<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna de Coven - Transmutación Perfecta</title>
    <style>
        :root {
            --gold: #dcb358;
            --gold-bright: #ffe55c;
            --purple-dark: #4a00e0;
            --purple-light: #8e2de2;
            --bg-dark: #07030d;
            --bg-light_moon: #51515128;
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Contenedor interactivo */
        .ritual-container {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: crosshair; 
        }

        /* === 1. AURA DE LA NEBULOSA === */
        .nebula-aura {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--purple-light) 0%, transparent 70%);
            box-shadow: 0 0 100px 30px var(--purple-dark);
            opacity: 0.3;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: breatheAura 4s ease-in-out infinite alternate;
        }

        /* === 2. GEOMETRÍA SAGRADA === */
        .sacred-geometry {
            position: absolute;
            width: 210px;
            height: 210px;
            border: 1px solid rgba(220, 179, 88, 0.15);
            box-shadow: 0 0 15px rgba(220, 179, 88, 0.05);
            transition: all 0.8s ease;
            animation: spinSlow 40s linear infinite;
        }
        .sacred-geometry::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border: 1px solid rgba(220, 179, 88, 0.15);
            transform: rotate(45deg);
        }

        /* === 3. ANILLO DE RUNAS === */
        .rune-ring {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: repeating-conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 10deg,
                rgba(220, 179, 88, 0.2) 10deg,
                rgba(220, 179, 88, 0.2) 10.5deg
            );
            -webkit-mask-image: radial-gradient(transparent 68%, black 69%);
            mask-image: radial-gradient(transparent 68%, black 69%);
            animation: spinSlowReverse 35s linear infinite;
            transition: all 0.6s ease;
        }

        /* === 4. ANILLO EXTERIOR DE INVOCACIÓN === */
        .summoning-ring {
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top: 2px solid rgba(142, 45, 226, 0.5);
            border-bottom: 2px solid rgba(220, 179, 88, 0.5);
            box-shadow: 0 0 30px rgba(142, 45, 226, 0.1), inset 0 0 20px rgba(142, 45, 226, 0.1);
            animation: spinSlow 20s linear infinite;
            transition: all 0.6s ease;
        }

        /* === 5. LA LUNA EN EL CENTRO (ESTADO NORMAL — REUSA ARTE LUNAR DE COVEN) === */
        .moon {
            position: absolute;
            width: 500px;
            height: 500px;
            background-color: #030105;
            border-radius: 50%;
            transform: scale(0.3); /* Escala perfecta para encajar a 150px */
            box-shadow: 0 0 24px rgba(215, 220, 235, 0.16);
            overflow: hidden;
            z-index: 10;
            transition: background-color 0.8s ease, box-shadow 0.8s ease;
        }

        .coven-moon-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            opacity: 1;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }

        /* === 6. LA LUNA AMARILLA CRECIENTE (CORREGIDA HACIA ADENTRO) === */
        .crescent-moon {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            z-index: 11;
            /* La sombra INSET dibuja la silueta perfectamente por dentro del círculo negro */
            box-shadow: inset 20px -10px 0 -2px var(--gold);
            transform: rotate(-15deg);
            opacity: 0; 
            transition: opacity 0.8s ease;
            pointer-events: none;
        }

        /* ======================================================== */
        /* ✨ MAGIA INTERACTIVA (HOVER) ✨ */
        /* ======================================================== */

        /* 1. La Luna se oscurece */
        .ritual-container:hover .moon {
            background-color: #030105;
            box-shadow: inset -60px 60px 120px rgba(0,0,0,1), inset 0 0 50px rgba(142, 45, 226, 0.4);
        }

        /* 2. La superficie lunar se eclipsa */
        .ritual-container:hover .coven-moon-canvas {
            opacity: 0;
        }

        /* 3. Aparece la luz amarilla (Fusión de sombra interna + resplandor externo) */
        .ritual-container:hover .crescent-moon {
            opacity: 1; 
            animation: pulseCrescent 3s ease-in-out infinite alternate;
        }

        /* 4. Los anillos mágicos reaccionan */
        .ritual-container:hover .nebula-aura {
            transform: scale(1.4);
            opacity: 0.6;
            background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
            box-shadow: 0 0 150px 60px rgba(220, 179, 88, 0.2);
        }

        .ritual-container:hover .summoning-ring {
            animation-duration: 4s; 
            border-top: 2px solid var(--gold-bright);
            border-bottom: 2px solid var(--purple-light);
            box-shadow: 0 0 60px rgba(142, 45, 226, 0.6), inset 0 0 40px rgba(220, 179, 88, 0.3);
        }

        .ritual-container:hover .rune-ring {
            animation-duration: 6s;
            background: repeating-conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 10deg,
                var(--gold-bright) 10deg,
                var(--gold-bright) 11.5deg
            );
        }

        .ritual-container:hover .sacred-geometry {
            animation-duration: 10s;
            border: 1px solid rgba(255, 229, 92, 0.4);
            box-shadow: 0 0 30px rgba(255, 229, 92, 0.3);
        }
        .ritual-container:hover .sacred-geometry::before {
            border: 1px solid rgba(255, 229, 92, 0.4);
        }

        /* === ANIMACIONES === */
        @keyframes breatheAura { 0% { transform: scale(0.9); } 100% { transform: scale(1.1); } }
        @keyframes spinSlow { 100% { transform: rotate(360deg); } }
        @keyframes spinSlowReverse { 100% { transform: rotate(-360deg); } }
        
        /* Animación de latido para la luna creciente DENTRO de los límites */
        @keyframes pulseCrescent {
            0% {
                box-shadow: 
                    inset 24px -14px 0 -2px var(--gold-bright), /* Filo interno */
                    -10px 5px 15px -2px var(--gold-bright),     /* Glow externo */
                    -15px 8px 30px -5px rgba(142, 45, 226, 0.4);
            }
            100% {
                box-shadow: 
                    inset 26px -16px 0 -2px #fff5a3,           /* Filo brillante máximo */
                    -15px 8px 25px 2px var(--gold-bright),      /* Expansión del glow externo */
                    -25px 12px 45px 0px rgba(142, 45, 226, 0.6);
            }
        }
    </style>
</head>
<body>
    
    <div class="ritual-container">
        <!-- Elementos del fondo mágico -->
        <div class="nebula-aura"></div>
        <div class="sacred-geometry"></div>
        <div class="rune-ring"></div>
        <div class="summoning-ring"></div>
        
        <!-- Arte Lunar de Coven (Se eclipsa al hacer Hover) -->
        <div class="moon">
            <canvas class="coven-moon-canvas" id="coven-about-moon-canvas" width="500" height="500" aria-hidden="true"></canvas>
        </div>
        
        <!-- La luz amarilla creciente (Con INSET para dibujar por dentro del límite) -->
        <div class="crescent-moon"></div>
    </div>

    <script>
        /* Static visual-only render of the canonical Coven Moon artwork (matches CovenAmbientBackground lunar surface) */
        (function () {
            var targetCanvas = document.getElementById('coven-about-moon-canvas');
            if (!targetCanvas) return;

            function buildCovenLunarMaps() {
                var w = 1024;
                var h = 512;

                var albedoCanvas = document.createElement('canvas');
                albedoCanvas.width = w;
                albedoCanvas.height = h;
                var aCtx = albedoCanvas.getContext('2d');

                var bumpCanvas = document.createElement('canvas');
                bumpCanvas.width = w;
                bumpCanvas.height = h;
                var bCtx = bumpCanvas.getContext('2d');

                aCtx.fillStyle = '#c4bfca';
                aCtx.fillRect(0, 0, w, h);

                bCtx.fillStyle = '#808080';
                bCtx.fillRect(0, 0, w, h);

                var seed = 90210;
                function rand() {
                    seed = (seed * 1664525 + 1013904223) % 4294967296;
                    return seed / 4294967296;
                }

                for (var i = 0; i < 320; i++) {
                    var x = rand() * w;
                    var y = rand() * h;
                    var r = 18 + rand() * 75;
                    var shade = Math.floor(175 + rand() * 45);
                    var grad = aCtx.createRadialGradient(x, y, 0, x, y, r);
                    grad.addColorStop(0, 'rgba(' + shade + ',' + (shade - 3) + ',' + (shade + 4) + ', 0.14)');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    aCtx.fillStyle = grad;
                    aCtx.beginPath();
                    aCtx.arc(x, y, r, 0, Math.PI * 2);
                    aCtx.fill();
                }

                var mariaList = [
                    { x: 0.34, y: 0.36, r: 95, dark: 96 },
                    { x: 0.48, y: 0.40, r: 80, dark: 102 },
                    { x: 0.60, y: 0.48, r: 85, dark: 94 },
                    { x: 0.24, y: 0.54, r: 105, dark: 105 },
                    { x: 0.75, y: 0.42, r: 65, dark: 100 },
                    { x: 0.12, y: 0.38, r: 60, dark: 108 },
                    { x: 0.86, y: 0.54, r: 72, dark: 102 }
                ];

                mariaList.forEach(function (m) {
                    var cx = m.x * w;
                    var cy = m.y * h;
                    for (var j = 0; j < 15; j++) {
                        var ox = cx + (rand() - 0.5) * m.r * 0.85;
                        var oy = cy + (rand() - 0.5) * m.r * 0.85;
                        var rad = m.r * (0.4 + rand() * 0.55);

                        var g = aCtx.createRadialGradient(ox, oy, rad * 0.1, ox, oy, rad);
                        g.addColorStop(0, 'rgba(' + m.dark + ',' + (m.dark - 4) + ',' + (m.dark + 6) + ', 0.28)');
                        g.addColorStop(0.7, 'rgba(' + (m.dark + 10) + ',' + (m.dark + 8) + ',' + (m.dark + 15) + ', 0.12)');
                        g.addColorStop(1, 'rgba(0,0,0,0)');
                        aCtx.fillStyle = g;
                        aCtx.beginPath();
                        aCtx.arc(ox, oy, rad, 0, Math.PI * 2);
                        aCtx.fill();
                    }
                });

                for (var k = 0; k < 850; k++) {
                    var kx = rand() * w;
                    var ky = (0.07 + rand() * 0.86) * h;
                    var kr = 1.4 + Math.pow(rand(), 3.2) * 32;

                    var bg = bCtx.createRadialGradient(kx, ky, kr * 0.1, kx, ky, kr * 1.2);
                    bg.addColorStop(0, 'rgba(35, 35, 35, 0.75)');
                    bg.addColorStop(0.7, 'rgba(60, 60, 60, 0.6)');
                    bg.addColorStop(0.86, 'rgba(235, 235, 235, 0.72)');
                    bg.addColorStop(1, 'rgba(128, 128, 128, 0)');
                    bCtx.fillStyle = bg;
                    bCtx.beginPath();
                    bCtx.arc(kx, ky, kr * 1.2, 0, Math.PI * 2);
                    bCtx.fill();

                    var ag = aCtx.createRadialGradient(kx, ky, kr * 0.2, kx, ky, kr * 1.1);
                    ag.addColorStop(0, 'rgba(130, 126, 138, 0.32)');
                    ag.addColorStop(0.8, 'rgba(225, 222, 232, 0.36)');
                    ag.addColorStop(1, 'rgba(0,0,0,0)');
                    aCtx.fillStyle = ag;
                    aCtx.beginPath();
                    aCtx.arc(kx, ky, kr * 1.1, 0, Math.PI * 2);
                    aCtx.fill();
                }

                return { albedoCanvas: albedoCanvas, bumpCanvas: bumpCanvas };
            }

            function drawFallback2DMoon(maps) {
                var ctx = targetCanvas.getContext('2d');
                if (!ctx) return;
                var size = targetCanvas.width;
                var half = size / 2;
                ctx.clearRect(0, 0, size, size);
                ctx.save();
                ctx.beginPath();
                ctx.arc(half, half, half, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(maps.albedoCanvas, 180, 0, 512, 512, 0, 0, size, size);
                var shade = ctx.createRadialGradient(half * 0.78, half * 0.72, half * 0.15, half, half, half);
                shade.addColorStop(0, 'rgba(247, 238, 220, 0.22)');
                shade.addColorStop(0.68, 'rgba(247, 238, 220, 0.04)');
                shade.addColorStop(0.92, 'rgba(40, 30, 58, 0.42)');
                shade.addColorStop(1, 'rgba(18, 12, 30, 0.72)');
                ctx.fillStyle = shade;
                ctx.fillRect(0, 0, size, size);
                ctx.restore();
            }

            function getThree() {
                try {
                    if (window.THREE) return window.THREE;
                    if (window.parent && window.parent.THREE) return window.parent.THREE;
                } catch (_) {}
                return null;
            }

            function renderExactCovenMoonFrame(THREE, maps) {
                try {
                    var size = targetCanvas.width;
                    var scene = new THREE.Scene();
                    var camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
                    camera.position.set(0, 0, 4.95);

                    var renderer = new THREE.WebGLRenderer({
                        antialias: true,
                        alpha: true,
                        preserveDrawingBuffer: true
                    });
                    renderer.setSize(size, size);
                    renderer.setPixelRatio(1);
                    renderer.toneMapping = THREE.ACESFilmicToneMapping;
                    renderer.toneMappingExposure = 1.08;

                    var colorTex = new THREE.CanvasTexture(maps.albedoCanvas);
                    colorTex.wrapS = THREE.RepeatWrapping;
                    colorTex.wrapT = THREE.ClampToEdgeWrapping;

                    var bumpTex = new THREE.CanvasTexture(maps.bumpCanvas);
                    bumpTex.wrapS = THREE.RepeatWrapping;
                    bumpTex.wrapT = THREE.ClampToEdgeWrapping;

                    var geometry = new THREE.SphereGeometry(1.52, 64, 64);
                    var material = new THREE.MeshStandardMaterial({
                        map: colorTex,
                        bumpMap: bumpTex,
                        bumpScale: 0.048,
                        roughness: 0.86,
                        metalness: 0.05
                    });

                    var mesh = new THREE.Mesh(geometry, material);
                    mesh.rotation.z = THREE.MathUtils.degToRad(11);
                    mesh.rotation.x = THREE.MathUtils.degToRad(6);
                    scene.add(mesh);

                    // Full-moon illumination matching CovenAmbientBackground full-moon phase
                    var fullRad = THREE.MathUtils.degToRad(170);
                    var sunLight = new THREE.DirectionalLight(0xf7eedc, 2.55);
                    sunLight.position.set(Math.sin(fullRad) * 15, Math.cos(fullRad * 0.8) * 3.2, -Math.cos(fullRad) * 15);
                    scene.add(sunLight);

                    var earthshine = new THREE.AmbientLight(0x281e3a, 0.42);
                    scene.add(earthshine);

                    var mysticRim = new THREE.DirectionalLight(0x9a75f0, 0.28);
                    mysticRim.position.set(-4, 3, -6);
                    scene.add(mysticRim);

                    renderer.render(scene, camera);

                    var ctx = targetCanvas.getContext('2d');
                    if (ctx) {
                        ctx.clearRect(0, 0, size, size);
                        ctx.drawImage(renderer.domElement, 0, 0, size, size);
                    }

                    // Release WebGL context immediately — this is a static visual-only artwork
                    geometry.dispose();
                    material.dispose();
                    colorTex.dispose();
                    bumpTex.dispose();
                    renderer.dispose();
                    if (renderer.forceContextLoss) renderer.forceContextLoss();
                    return true;
                } catch (_) {
                    return false;
                }
            }

            var maps = buildCovenLunarMaps();
            drawFallback2DMoon(maps);

            var THREE = getThree();
            if (THREE) {
                renderExactCovenMoonFrame(THREE, maps);
            } else {
                var tries = 0;
                var timer = setInterval(function () {
                    tries += 1;
                    var t = getThree();
                    if (t) {
                        clearInterval(timer);
                        renderExactCovenMoonFrame(t, maps);
                    } else if (tries >= 40) {
                        clearInterval(timer);
                    }
                }, 75);
            }
        })();
    </script>

    <script>
        (function () {
            var container = document.querySelector('.ritual-container');
            if (!container) return;

            var AudioCtor = window.Audio || (window.top && window.top.Audio);
            if (!AudioCtor) return;

            var TARGET_VOLUME = 0.35;
            var sound = new AudioCtor('/assets/about/audio/sonido de fondo.mp3');
            sound.preload = 'auto';
            sound.loop = false;
            sound.volume = TARGET_VOLUME;
            try { sound.load(); } catch (_) {}

            var isHovering = false;
            var audioUnlocked = false;
            var triggerCount = 0;
            var playSuccessCount = 0;
            var lastError = null;

            function markStageUnlocked() {
                try {
                    if (window.frameElement && window.frameElement.parentElement) {
                        window.frameElement.parentElement.setAttribute('data-audio-unlocked', 'true');
                    }
                } catch (_) {}
            }

            function playSoundFromStart() {
                try {
                    sound.pause();
                    if (sound.readyState > 0) {
                        try { sound.currentTime = 0; } catch (_) {}
                    }
                    sound.muted = false;
                    sound.volume = TARGET_VOLUME;
                    var playPromise = sound.play();
                    if (playPromise && typeof playPromise.then === 'function') {
                        playPromise.then(function () {
                            playSuccessCount += 1;
                            lastError = null;
                        }).catch(function (err) {
                            var name = (err && err.name) ? err.name : 'Error';
                            var message = (err && err.message) ? err.message : String(err);
                            lastError = { name: name, message: message };
                            if (name !== 'NotAllowedError' && name !== 'AbortError') {
                                console.warn('[Coven Luna Audio]', name, message);
                            }
                        });
                    } else {
                        playSuccessCount += 1;
                        lastError = null;
                    }
                } catch (err) {
                    var name = (err && err.name) ? err.name : 'Error';
                    var message = (err && err.message) ? err.message : String(err);
                    lastError = { name: name, message: message };
                    if (name !== 'NotAllowedError' && name !== 'AbortError') {
                        console.warn('[Coven Luna Audio]', name, message);
                    }
                }
            }

            function activateMoonAudio() {
                if (audioUnlocked) return;
                audioUnlocked = true;
                isHovering = true;
                triggerCount += 1;
                markStageUnlocked();
                container.removeEventListener('pointerdown', activateMoonAudio);
                container.removeEventListener('click', activateMoonAudio);
                playSoundFromStart();
            }

            container.addEventListener('pointerdown', activateMoonAudio);
            container.addEventListener('click', activateMoonAudio);

            container.addEventListener('pointerenter', function () {
                if (isHovering) return;
                isHovering = true;
                if (!audioUnlocked) return;
                triggerCount += 1;
                playSoundFromStart();
            });

            container.addEventListener('pointerleave', function () {
                isHovering = false;
            });

            window.__lunaAudio = {
                sound: sound,
                isHovering: function () { return isHovering; },
                isUnlocked: function () { return audioUnlocked; },
                getTriggerCount: function () { return triggerCount; },
                getPlaySuccessCount: function () { return playSuccessCount; },
                getLastError: function () { return lastError; }
            };
        })();
    </script>
</body>
</html>
